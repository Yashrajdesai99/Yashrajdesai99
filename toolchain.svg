<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d"><title id="t">Toolchain and areas of exploration</title><desc id="d">Three editorial panels show programming languages, web interface tools, and system-level interests.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171416"/><stop offset="1" stop-color="#09090b"/></linearGradient><linearGradient id="signal"><stop stop-color="#f04444" stop-opacity="0"/><stop offset=".5" stop-color="#ff686d"/><stop offset="1" stop-color="#f04444" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="190" rx="14" fill="url(#bg)"/><g stroke="#f04444" stroke-opacity=".32"><path d="M400 18V172M800 18V172"/></g><path d="M0 150H1200" stroke="#fff" stroke-opacity=".06"/><path d="M0 18H1200" stroke="url(#signal)" stroke-width="2" class="scan"/>
<g font-family="ui-monospace,monospace"><text x="30" y="36" fill="#ff686d" font-size="11" letter-spacing="2">01 / PROGRAMMING</text><text x="30" y="77" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="28" font-weight="700">Logic &amp; code</text><g fill="#281619" stroke="#7b333a"><rect x="30" y="98" width="92" height="29" rx="4"/><rect x="132" y="98" width="76" height="29" rx="4"/><rect x="218" y="98" width="117" height="29" rx="4"/></g><g fill="#f4e9ea" font-size="11"><text x="76" y="117" text-anchor="middle">PYTHON</text><text x="170" y="117" text-anchor="middle">JAVA</text><text x="276" y="117" text-anchor="middle">JAVASCRIPT</text></g><text x="30" y="158" fill="#8b7f82" font-size="10">Build a strong foundation.</text>
<text x="430" y="36" fill="#ff686d" font-size="11" letter-spacing="2">02 / WEB &amp; INTERFACE</text><text x="430" y="77" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="28" font-weight="700">Shape the experience</text><g fill="#281619" stroke="#7b333a"><rect x="430" y="98" width="76" height="29" rx="4"/><rect x="516" y="98" width="70" height="29" rx="4"/><rect x="596" y="98" width="84" height="29" rx="4"/><rect x="690" y="98" width="80" height="29" rx="4"/></g><g fill="#f4e9ea" font-size="11"><text x="468" y="117" text-anchor="middle">HTML</text><text x="551" y="117" text-anchor="middle">CSS</text><text x="638" y="117" text-anchor="middle">REACT</text><text x="730" y="117" text-anchor="middle">NODE</text></g><text x="430" y="158" fill="#8b7f82" font-size="10">Make it clear and useful.</text>
<text x="830" y="36" fill="#ff686d" font-size="11" letter-spacing="2">03 / SYSTEMS &amp; DISCOVERY</text><text x="830" y="77" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="28" font-weight="700">Look underneath</text><g fill="#281619" stroke="#7b333a"><rect x="830" y="98" width="85" height="29" rx="4"/><rect x="925" y="98" width="97" height="29" rx="4"/><rect x="1032" y="98" width="133" height="29" rx="4"/></g><g fill="#f4e9ea" font-size="11"><text x="872" y="117" text-anchor="middle">LINUX</text><text x="973" y="117" text-anchor="middle">NETWORKS</text><text x="1098" y="117" text-anchor="middle">AI / SECURITY</text></g><text x="830" y="158" fill="#8b7f82" font-size="10">Explore how things work.</text></g>
