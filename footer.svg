<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d"><title id="t">Keep exploring. Make something real.</title><desc id="d">A quiet obsidian closing panel with a laser-red pulse, fine grid, and custom typographic signature.</desc>
<defs><linearGradient id="bg" x2="1" y2="0"><stop stop-color="#0b0a0c"/><stop offset=".5" stop-color="#211619"/><stop offset="1" stop-color="#0b0a0c"/></linearGradient><linearGradient id="line"><stop stop-color="#f04444" stop-opacity="0"/><stop offset=".5" stop-color="#ff7579"/><stop offset="1" stop-color="#f04444" stop-opacity="0"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="190" rx="14" fill="url(#bg)"/><rect width="1200" height="190" rx="14" fill="url(#grid)"/><path d="M0 22H1200M0 164H1200" stroke="#fff" stroke-opacity=".07"/><path d="M0 22H1200" stroke="url(#line)" stroke-width="2" class="pulse"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="600" y="82" fill="#f7f1f1" font-size="38" font-weight="800" letter-spacing="1">KEEP EXPLORING<tspan fill="#f04444">.</tspan></text><text x="600" y="116" fill="#c0b5b8" font-size="14" letter-spacing="5">MAKE SOMETHING REAL</text></g><g font-family="ui-monospace,monospace" fill="#f04444" font-size="10"><text x="26" y="178">YASHRAJ.EXE / PERSONAL BUILD LOG</text><text x="1174" y="178" text-anchor="end">END OF TRANSMISSION / 001</text></g><rect x=".5" y=".5" width="1199" height="189" rx="14" fill="none" stroke="#fff" stroke-opacity=".12"/><style>@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 3.5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></svg>
