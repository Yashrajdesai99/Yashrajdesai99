<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="Yashraj Desai GitSkins Living Identity">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Radar Glow & Gradients -->
    <radialGradient id="radarGlow" cx="77%" cy="43%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070c17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#132338" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="cardClip">
      <rect width="1000" height="570" rx="16" ry="16"/>
    </clipPath>

    <clipPath id="radarClip">
      <circle cx="780" cy="240" r="185"/>
    </clipPath>
  </defs>

  <style>
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.08); }
    }
    @keyframes sweepRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes scanLineH {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(570px); opacity: 0.1; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .radar-rotate-cw {
      transform-origin: 780px 240px;
      animation: spinCW 24s linear infinite;
    }
    .radar-rotate-ccw {
      transform-origin: 780px 240px;
      animation: spinCCW 36s linear infinite;
    }
    .radar-rotate-fast {
      transform-origin: 780px 240px;
      animation: spinCW 14s linear infinite;
    }
    .radar-sweeper {
      transform-origin: 780px 240px;
      animation: sweepRadar 5s linear infinite;
    }
    .pulse-dot {
      animation: pulseGlow 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .twinkle-1 { animation: twinkle 3s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4s ease-in-out infinite 1s; }
    .twinkle-3 { animation: twinkle 2.5s ease-in-out infinite 1.8s; }
    .scanner-line { animation: scanLineH 8s linear infinite; }
    .status-dot { animation: blinkDot 2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .radar-rotate-cw, .radar-rotate-ccw, .radar-rotate-fast, .radar-sweeper, .pulse-dot, .twinkle-1, .twinkle-2, .twinkle-3, .scanner-line {
        animation: none !important;
      }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Base Canvas -->
    <rect width="1000" height="570" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" rx="16"/>
    <!-- Cyber Grid -->
    <rect width="1000" height="570" fill="url(#cyberGrid)"/>
    <rect width="1000" height="570" fill="url(#dotGrid)"/>

    <!-- Subtle Scanline -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#38bdf8" stroke-width="1.5" class="scanner-line"/>

    <!-- Radar Ambient Ambient Glow -->
    <rect width="1000" height="570" fill="url(#radarGlow)"/>

    <!-- ==================== HEADER INFO ==================== -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="42" y="44" fill="#38bdf8" font-size="12" letter-spacing="3" font-weight="600" opacity="0.85">GITSKINS  /  LIVING IDENTITY</text>
      <text x="958" y="44" fill="#94a3b8" font-size="12" letter-spacing="1.5" text-anchor="end">@yashrajdesai99</text>
      
      <!-- Horizontal Rule -->
      <line x1="42" y1="62" x2="958" y2="62" stroke="#1e2d42" stroke-width="1"/>
    </g>

    <!-- ==================== HERO BIO (LEFT SIDE) ==================== -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="42" y="126" fill="#38bdf8" font-size="13" letter-spacing="4" font-weight="600">HELLO, WORLD. I'M</text>
    </g>

    <!-- Large Name with Cyber Stipple Texture -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="1">
      <!-- Glow background -->
      <text x="42" y="210" fill="#38bdf8" font-size="58" opacity="0.25" filter="url(#glow)">Yashraj</text>
      <text x="42" y="278" fill="#38bdf8" font-size="58" opacity="0.25" filter="url(#glow)">Desai</text>
      
      <!-- Primary Foreground Name -->
      <text x="42" y="210" fill="#f8fafc" font-size="58">Yashraj</text>
      <text x="42" y="278" fill="#f8fafc" font-size="58">Desai</text>
    </g>

    <!-- Subtitle & Bio Details -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="42" y="348" fill="#e2e8f0" font-size="20" font-weight="600" letter-spacing="0.5">TypeScript  /  Python  /  CSS</text>
      <text x="42" y="380" fill="#64748b" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">On the public internet</text>
    </g>

    <!-- Status pill -->
    <g transform="translate(42, 404)">
      <rect width="138" height="26" rx="13" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#10b981" class="status-dot"/>
      <text x="28" y="17" fill="#94a3b8" font-size="11" font-family="ui-monospace, monospace" letter-spacing="1">SYSTEM ACTIVE</text>
    </g>

    <!-- ==================== RADAR & MATRIX AVATAR (RIGHT SIDE) ==================== -->
    <g id="radar-system">
      <!-- Center Anchor: (780, 240) -->

      <!-- Outer Radar Circle with Dashes (Rotating Clockwise) -->
      <circle cx="780" cy="240" r="185" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="6 8" class="radar-rotate-cw" opacity="0.6"/>
      <circle cx="780" cy="240" r="172" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="24 16 8 16" class="radar-rotate-fast" opacity="0.75"/>
      <circle cx="780" cy="240" r="148" fill="none" stroke="#1e293b" stroke-width="1"/>
      <circle cx="780" cy="240" r="120" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="4 12" class="radar-rotate-ccw" opacity="0.5"/>
      <circle cx="780" cy="240" r="85" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 6"/>
      <circle cx="780" cy="240" r="45" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>

      <!-- Crosshairs -->
      <line x1="590" y1="240" x2="630" y2="240" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
      <line x1="930" y1="240" x2="970" y2="240" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
      <line x1="780" y1="50" x2="780" y2="90" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
      <line x1="780" y1="390" x2="780" y2="430" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

      <!-- Diagonal Corner Ticks (Rotating with radar) -->
      <g class="radar-rotate-cw" opacity="0.7">
        <path d="M 649 109 L 661 121 M 911 109 L 899 121 M 649 371 L 661 359 M 911 371 L 899 359" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="780" cy="68" r="3" fill="#38bdf8"/>
        <circle cx="952" cy="240" r="3" fill="#38bdf8"/>
        <circle cx="780" cy="412" r="3" fill="#38bdf8"/>
        <circle cx="608" cy="240" r="3" fill="#38bdf8"/>
      </g>

      <!-- Sweeping Radar Beam Cone (Rotating) -->
      <g clip-path="url(#radarClip)">
        <g class="radar-sweeper">
          <path d="M 780 240 L 965 240 A 185 185 0 0 0 911 109 Z" fill="url(#sweepGrad)"/>
          <line x1="780" y1="240" x2="965" y2="240" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
        </g>
      </g>

      <!-- Dot-Matrix Silhouette of Developer Face / Profile inside Radar -->
      <g clip-path="url(#radarClip)" fill="#93c5fd">
        <!-- Head Top Curve Dots -->
        <g class="twinkle-1">
          <circle cx="760" cy="142" r="2.2" fill="#cbd5e1"/>
          <circle cx="770" cy="140" r="2.2" fill="#cbd5e1"/>
          <circle cx="780" cy="140" r="2.5" fill="#f8fafc"/>
          <circle cx="790" cy="141" r="2.2" fill="#f8fafc"/>
          <circle cx="802" cy="147" r="2.2" fill="#93c5fd"/>
          <circle cx="812" cy="154" r="2.2" fill="#60a5fa"/>
        </g>
        <!-- Forehead & Temples -->
        <g class="twinkle-2">
          <circle cx="745" cy="152" r="2" fill="#94a3b8"/>
          <circle cx="756" cy="148" r="2.2" fill="#cbd5e1"/>
          <circle cx="820" cy="162" r="2.2" fill="#93c5fd"/>
          <circle cx="826" cy="172" r="2.2" fill="#60a5fa"/>
          <circle cx="830" cy="184" r="2.2" fill="#38bdf8"/>
        </g>
        <!-- Right Face Contour / Profile Line -->
        <g class="twinkle-3">
          <circle cx="834" cy="198" r="2.4" fill="#f8fafc"/>
          <circle cx="835" cy="210" r="2.4" fill="#f8fafc"/>
          <circle cx="835" cy="222" r="2.4" fill="#f8fafc"/>
          <circle cx="836" cy="234" r="2.4" fill="#93c5fd"/>
          <circle cx="835" cy="246" r="2.4" fill="#60a5fa"/>
          <circle cx="831" cy="256" r="2.2" fill="#38bdf8"/>
        </g>
        <!-- Eyebrow & Eye Contour points -->
        <g class="twinkle-1">
          <circle cx="765" cy="194" r="1.8" fill="#38bdf8"/>
          <circle cx="774" cy="199" r="2" fill="#cbd5e1"/>
          <circle cx="784" cy="204" r="2.2" fill="#f8fafc"/>
          <circle cx="792" cy="208" r="2.2" fill="#93c5fd"/>
        </g>
        <!-- Nose Bridge & Tip -->
        <g class="twinkle-2">
          <circle cx="756" cy="228" r="2" fill="#60a5fa"/>
          <circle cx="745" cy="242" r="2.2" fill="#93c5fd"/>
          <circle cx="752" cy="246" r="2.4" fill="#f8fafc"/>
          <circle cx="762" cy="246" r="2" fill="#cbd5e1"/>
        </g>
        <!-- Lips & Chin -->
        <g class="twinkle-3">
          <circle cx="752" cy="265" r="2" fill="#60a5fa"/>
          <circle cx="760" cy="272" r="2.2" fill="#93c5fd"/>
          <circle cx="754" cy="286" r="2.4" fill="#f8fafc"/>
          <circle cx="762" cy="294" r="2.4" fill="#f8fafc"/>
          <circle cx="774" cy="302" r="2.2" fill="#93c5fd"/>
          <circle cx="788" cy="310" r="2" fill="#60a5fa"/>
        </g>
        <!-- Jawline & Neck -->
        <g class="twinkle-1">
          <circle cx="802" cy="318" r="2.2" fill="#60a5fa"/>
          <circle cx="816" cy="326" r="2.2" fill="#38bdf8"/>
          <circle cx="828" cy="336" r="2" fill="#2563eb"/>
          <circle cx="830" cy="285" r="2" fill="#38bdf8"/>
          <circle cx="832" cy="298" r="2" fill="#60a5fa"/>
          <circle cx="836" cy="312" r="2" fill="#93c5fd"/>
          <circle cx="842" cy="324" r="2.2" fill="#cbd5e1"/>
        </g>
        <!-- Shoulders & Torso Points Array -->
        <g class="twinkle-2">
          <circle cx="680" cy="385" r="2.2" fill="#38bdf8"/>
          <circle cx="696" cy="380" r="2.2" fill="#60a5fa"/>
          <circle cx="712" cy="374" r="2.2" fill="#93c5fd"/>
          <circle cx="728" cy="366" r="2.4" fill="#f8fafc"/>
          <circle cx="744" cy="358" r="2.2" fill="#cbd5e1"/>
          <circle cx="850" cy="338" r="2.2" fill="#93c5fd"/>
          <circle cx="862" cy="346" r="2.2" fill="#60a5fa"/>
          <circle cx="878" cy="356" r="2.4" fill="#38bdf8"/>
          <circle cx="894" cy="368" r="2.4" fill="#2563eb"/>
          <circle cx="910" cy="380" r="2.2" fill="#1d4ed8"/>
          <circle cx="924" cy="392" r="2.2" fill="#1e40af"/>
        </g>
        <!-- Matrix Crosses / Sparkles -->
        <g font-family="monospace" font-size="9" fill="#38bdf8" opacity="0.6">
          <text x="730" y="170">+</text>
          <text x="840" y="160">+</text>
          <text x="710" y="270">+</text>
          <text x="860" y="280">+</text>
          <text x="790" y="340">+</text>
          <text x="880" y="340">+</text>
          <text x="700" y="340">+</text>
          <text x="850" y="230">+</text>
        </g>
      </g>
    </g>

    <!-- ==================== FOOTER METRICS (BOTTOM BAR) ==================== -->
    <g transform="translate(0, 448)">
      <!-- Divider Line -->
      <line x1="42" y1="0" x2="958" y2="0" stroke="#1e2d42" stroke-width="1"/>

      <!-- Metric 1: REPOSITORIES -->
      <g transform="translate(42, 24)">
        <text x="0" y="0" fill="#64748b" font-size="11" font-family="ui-monospace, monospace" letter-spacing="2">REPOSITORIES</text>
        <circle cx="180" cy="-3" r="3.5" fill="#38bdf8" class="pulse-dot"/>
        <text x="0" y="38" fill="#f8fafc" font-size="32" font-family="system-ui, sans-serif" font-weight="700">7</text>
      </g>

      <!-- Metric 2: STARS -->
      <g transform="translate(280, 24)">
        <text x="0" y="0" fill="#64748b" font-size="11" font-family="ui-monospace, monospace" letter-spacing="2">STARS</text>
        <circle cx="180" cy="-3" r="3.5" fill="#38bdf8" class="pulse-dot"/>
        <text x="0" y="38" fill="#f8fafc" font-size="32" font-family="system-ui, sans-serif" font-weight="700">4</text>
      </g>

      <!-- Metric 3: CONTRIBUTIONS -->
      <g transform="translate(520, 24)">
        <text x="0" y="0" fill="#64748b" font-size="11" font-family="ui-monospace, monospace" letter-spacing="2">CONTRIBUTIONS</text>
        <circle cx="180" cy="-3" r="3.5" fill="#38bdf8" class="pulse-dot"/>
        <text x="0" y="38" fill="#f8fafc" font-size="32" font-family="system-ui, sans-serif" font-weight="700">36</text>
      </g>

      <!-- Metric 4: FOLLOWERS -->
      <g transform="translate(760, 24)">
        <text x="0" y="0" fill="#64748b" font-size="11" font-family="ui-monospace, monospace" letter-spacing="2">FOLLOWERS</text>
        <circle cx="180" cy="-3" r="3.5" fill="#38bdf8" class="pulse-dot"/>
        <text x="0" y="38" fill="#f8fafc" font-size="32" font-family="system-ui, sans-serif" font-weight="700">3</text>
      </g>

      <!-- Watermark Bottom Right -->
      <text x="958" y="76" fill="#334155" font-size="10" font-family="ui-monospace, monospace" letter-spacing="1" text-anchor="end">gitskins.com</text>
    </g>

    <!-- Outer Tech Corner Brackets -->
    <path d="M 12 36 L 12 12 L 36 12" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 988 36 L 988 12 L 964 12" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 12 534 L 12 558 L 36 558" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 988 534 L 988 558 L 964 558" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
</svg>