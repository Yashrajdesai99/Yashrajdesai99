<text x="428" y="32" fill="#ff686d" font-size="10" letter-spacing="2">02 / EXPLORE DEEPLY</text><g transform="translate(452 91)" fill="none" stroke="#f04444"><circle r="25"/><ellipse rx="11" ry="25" stroke="#ff777b"/><path d="M-24 0H24M-18 -15H18M-18 15H18"/></g><text x="492" y="83" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="23" font-weight="700">Ask better questions.</text><text x="492" y="108" fill="#a99da0" font-size="11">Understand the system underneath.</text>
