<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="170" viewBox="0 0 1100 170" role="img" aria-labelledby="t d"><title id="t">Build / Learn / Ship</title><desc id="d">Three connected stages with animated signal traveling through a technical line.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161417"/><stop offset="1" stop-color="#09090b"/></linearGradient><linearGradient id="signal"><stop stop-color="#f04444" stop-opacity="0"/><stop offset=".5" stop-color="#ff7777"/><stop offset="1" stop-color="#f04444" stop-opacity="0"/></linearGradient></defs><rect width="1100" height="170" rx="12" fill="url(#bg)"/><path d="M80 85H1020" stroke="#4b2025" stroke-width="2"/><path d="M80 85H1020" stroke="url(#signal)" stroke-width="3" class="signal"/><g font-family="ui-monospace,monospace"><g transform="translate(140 85)"><circle r="33" fill="#1d1719" stroke="#f04444"/><path d="M-15 -7L0 -16L15 -7L0 2Z" fill="#f04444"/><path d="M-15 -7V11L0 20V2M0 2L15 -7V11L0 20" fill="none" stroke="#ff8b8b"/><text y="58" text-anchor="middle" fill="#fff" font-size="13" letter-spacing="2">01 / BUILD</text></g><g transform="translate(550 85)"><circle r="33" fill="#1d1719" stroke="#f04444"/><circle r="16" fill="none" stroke="#ff7777" stroke-width="1.5"/><ellipse rx="7" ry="16" fill="none" stroke="#f04444"/><path d="M-16 0H16" stroke="#f04444"/><text y="58" text-anchor="middle" fill="#fff" font-size="13" letter-spacing="2">02 / LEARN</text></g><g transform="translate(960 85)"><circle r="33" fill="#1d1719" stroke="#f04444"/><path d="M-17 7H-7L0 -10L7 12L15 -4H19" fill="none" stroke="#ff7777" stroke-width="2"/><text y="58" text-anchor="middle" fill="#fff" font-size="13" letter-spacing="2">03 / SHIP</text></g></g><style>.signal{stroke-dasharray:80 900;animation:travel 4.5s linear infinite}@keyframes travel{to{stroke-dashoffset:-980}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x=".5" y=".5" width="1099" height="169" rx="12" fill="none" stroke="#fff" stroke-opacity=".1"/></svg>