<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Smart Study Tracker</title><desc id="d">A dark planning dashboard illustration with floating study cards, checkmarks, timeline and laser-red progress indicator.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#09090b"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#292428"/><stop offset="1" stop-color="#121113"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs><rect width="720" height="310" rx="12" fill="url(#bg)"/><rect width="720" height="310" rx="12" fill="url(#grid)"/>
<g transform="translate(351 150) rotate(-5)"><rect x="-25" y="-94" width="268" height="184" rx="8" fill="#050506" stroke="#4b3a3e"/><rect x="-12" y="-82" width="242" height="160" rx="4" fill="url(#panel)"/><text x="4" y="-60" fill="#f6eeee" font-family="ui-monospace,monospace" font-size="12">STUDY / OVERVIEW</text><text x="4" y="-35" fill="#8f8387" font-family="ui-monospace,monospace" font-size="9">YOUR WEEK, IN FOCUS</text><g transform="translate(8 -12)"><rect width="202" height="27" rx="4" fill="#1a171a" stroke="#4e3b3f"/><rect x="9" y="8" width="11" height="11" rx="2" fill="#f04444"/><path d="M12 13L15 16L20 9" fill="none" stroke="#160b0c" stroke-width="1.8"/><text x="31" y="17" fill="#d9d0d2" font-family="Arial,sans-serif" font-size="10">Review networking notes</text><rect y="35" width="202" height="27" rx="4" fill="#1a171a" stroke="#4e3b3f"/><rect x="9" y="43" width="11" height="11" rx="2" fill="none" stroke="#f04444"/><text x="31" y="52" fill="#d9d0d2" font-family="Arial,sans-serif" font-size="10">Practice Python basics</text><rect y="70" width="202" height="27" rx="4" fill="#1a171a" stroke="#4e3b3f"/><rect x="9" y="78" width="11" height="11" rx="2" fill="none" stroke="#f04444"/><text x="31" y="87" fill="#d9d0d2" font-family="Arial,sans-serif" font-size="10">Build a small feature</text></g></g>
<g transform="translate(575 61)"><circle r="49" fill="#231518" stroke="#4a282d"/><circle r="37" fill="none" stroke="#4d3d40" stroke-width="8"/><circle r="37" fill="none" stroke="#f04444" stroke-width="8" stroke-linecap="round" stroke-dasharray="157 233" transform="rotate(-90)" class="progress"/><text y="4" text-anchor="middle" fill="#f8eeee" font-family="ui-monospace,monospace" font-size="18" font-weight="700">FOCUS</text><text y="18" text-anchor="middle" fill="#ff7a7e" font-family="ui-monospace,monospace" font-size="8">SESSION</text></g>
<g font-family="ui-monospace,monospace"><text x="28" y="34" fill="#ff686d" font-size="11" letter-spacing="2">PROJECT 03 / LEARNING SYSTEM</text><text x="28" y="93" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="39" font-weight="800">SMART STUDY</text><text x="28" y="138" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="39" font-weight="800">TRACKER<tspan fill="#f04444">.</tspan></text><text x="30" y="169" fill="#c5b9bc" font-size="12">Make the next step easier to see.</text><path d="M30 188H215" stroke="#f04444" stroke-width="2"/><text x="30" y="276" fill="#8d8083" font-size="10" letter-spacing="2">PYTHON / PRODUCTIVITY</text><text x="686" y="276" text-anchor="end" fill="#f04444" font-size="10">MODE : FOCUS</text></g><rect x=".5" y=".5" width="719" height="309" rx="12" fill="none" stroke="#fff" stroke-opacity=".14"/><style>@keyframes progress{0%{stroke-dasharray:90 233}100%{stroke-dasharray:157 233}}.progress{animation:progress 4s ease-in-out infinite alternate}@media(prefers-reduced-motion:reduce){.progress{animation:none}}</style></svg>
