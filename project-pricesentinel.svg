<g font-family="ui-monospace,monospace"><text x="28" y="34" fill="#ff686d" font-size="11" letter-spacing="2">PROJECT 02 / PRICE SIGNALS</text><text x="28" y="93" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="42" font-weight="800">PRICE<tspan fill="#f04444">SENTINEL</tspan></text><text x="30" y="120" fill="#c5b9bc" font-size="12">Observe the change. Follow the signal.</text><path d="M30 145H215" stroke="#f04444" stroke-width="2"/><text x="30" y="276" fill="#8d8083" font-size="10" letter-spacing="2">PYTHON / PRICE MONITORING</text><text x="686" y="276" text-anchor="end" fill="#f04444" font-size="10">MODE : WATCH</text></g><rect x=".5" y=".5" width="719" height="309" rx="12" fill="none" stroke="#fff" stroke-opacity=".14"/><style>@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}g[transform="translate(568 60)"]{animation:breathe 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){g[transform="translate(568 60)"]{animation:none}}</style></svg>
