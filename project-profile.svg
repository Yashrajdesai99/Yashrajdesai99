<g font-family="ui-monospace,monospace"><text x="28" y="34" fill="#ff686d" font-size="11" letter-spacing="2">PROJECT 06 / SOURCE FILES</text><text x="28" y="100" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="40" font-weight="800">PROFILE</text><text x="28" y="145" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="40" font-weight="800">SOURCE<tspan fill="#f04444">.</tspan></text><text x="30" y="174" fill="#c5b9bc" font-size="12">A living identity, made from vectors.</text><path d="M30 195H215" stroke="#f04444" stroke-width="2"/><text x="30" y="276" fill="#8d8083" font-size="10" letter-spacing="2">MARKDOWN / SVG / DESIGN SYSTEM</text><text x="686" y="276" text-anchor="end" fill="#f04444" font-size="10">SOURCE : OPEN</text></g><rect x=".5" y=".5" width="719" height="309" rx="12" fill="none" stroke="#fff" stroke-opacity=".14"/><style>@keyframes depth{0%,100%{transform:translate(490px,144px)}50%{transform:translate(490px,132px)}}.layer{animation:depth 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.layer{animation:none}}</style></svg>
