<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Personal Expense Tracker</title><desc id="d">A custom financial ledger visual with a red donut chart, stacked expense entries and thin graph lines.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171517"/><stop offset="1" stop-color="#08080a"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#30282b"/><stop offset="1" stop-color="#141214"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs>
<rect width="720" height="310" rx="12" fill="url(#bg)"/><rect width="720" height="310" rx="12" fill="url(#grid)"/>
<g transform="translate(380 65)"><rect width="280" height="190" rx="9" fill="url(#card)" stroke="#5b4549"/><text x="18" y="25" fill="#d7ccce" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">SPENDING SNAPSHOT</text><text x="18" y="52" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="24" font-weight="700">Your money, mapped.</text><circle cx="76" cy="117" r="39" fill="none" stroke="#4d4144" stroke-width="12"/><circle cx="76" cy="117" r="39" fill="none" stroke="#f04444" stroke-width="12" stroke-dasharray="102 245" transform="rotate(-90 76 117)"/><circle cx="76" cy="117" r="39" fill="none" stroke="#ff8588" stroke-width="12" stroke-dasharray="49 245" stroke-dashoffset="-108" transform="rotate(-90 76 117)"/><circle cx="76" cy="117" r="39" fill="none" stroke="#875156" stroke-width="12" stroke-dasharray="32 245" stroke-dashoffset="-165" transform="rotate(-90 76 117)"/><g font-family="ui-monospace,monospace" font-size="10"><circle cx="145" cy="94" r="3" fill="#f04444"/><text x="155" y="98" fill="#e9dfe0">Essentials</text><circle cx="145" cy="117" r="3" fill="#ff8588"/><text x="155" y="121" fill="#e9dfe0">Lifestyle</text><circle cx="145" cy="140" r="3" fill="#875156"/><text x="155" y="144" fill="#e9dfe0">Other</text></g><path d="M18 164H262" stroke="#fff" stroke-opacity=".1"/><path d="M18 177H170" stroke="#f04444" stroke-opacity=".75" stroke-width="2"/></g>
<g font-family="ui-monospace,monospace"><text x="28" y="34" fill="#ff686d" font-size="11" letter-spacing="2">PROJECT 04 / EVERYDAY FINANCE</text><text x="28" y="98" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="36" font-weight="800">PERSONAL</text><text x="28" y="142" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="36" font-weight="800">EXPENSE<tspan fill="#f04444">.</tspan></text><text x="30" y="170" fill="#c5b9bc" font-size="12">Bring the everyday numbers into focus.</text><path d="M30 192H215" stroke="#f04444" stroke-width="2"/><text x="30" y="276" fill="#8d8083" font-size="10" letter-spacing="2">PYTHON / PERSONAL UTILITY</text><text x="686" y="276" text-anchor="end" fill="#f04444" font-size="10">MODE : LEDGER</text></g><rect x=".5" y=".5" width="719" height="309" rx="12" fill="none" stroke="#fff" stroke-opacity=".14"/></svg>
