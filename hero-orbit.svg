<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="t d">
<title id="t">Obsidian orbit</title><desc id="d">An animated red wireframe orbital sculpture with concentric ellipses and a faceted core.</desc>
<defs><radialGradient id="a"><stop stop-color="#ff4747" stop-opacity=".28"/><stop offset="1" stop-color="#ff4747" stop-opacity="0"/></radialGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7878"/><stop offset=".52" stop-color="#e62430"/><stop offset="1" stop-color="#510e16"/></linearGradient><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#393035"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs>
<ellipse cx="362" cy="269" rx="235" ry="185" fill="url(#a)"/>
<g fill="none" stroke="#f04444" stroke-opacity=".45" stroke-width="1.2"><ellipse cx="360" cy="260" rx="282" ry="95" transform="rotate(-25 360 260)"/><ellipse cx="360" cy="260" rx="282" ry="95" transform="rotate(42 360 260)"/><ellipse cx="360" cy="260" rx="225" ry="160" transform="rotate(70 360 260)"/></g>
<ellipse cx="360" cy="420" rx="142" ry="24" fill="#ff202f" opacity=".16" filter="url(#g)"/>
<g class="core"><path d="M360 95L472 160L360 225L248 160Z" fill="url(#r)" stroke="#ff9898" stroke-opacity=".8"/><path d="M248 160L360 225V365L248 300Z" fill="url(#f)" stroke="#f04444" stroke-opacity=".85"/><path d="M360 225L472 160V300L360 365Z" fill="#191518" stroke="#ff5b62" stroke-opacity=".9"/><path d="M360 95V225M248 160L360 225L472 160M360 225V365" fill="none" stroke="#ff9898" stroke-opacity=".75"/><path d="M288 160L360 119L432 160L360 202Z" fill="#101012"/><path d="M281 282L360 327L439 282" fill="none" stroke="#ff414d" stroke-width="2"/></g>
<g fill="#ff646b"><circle cx="105" cy="162" r="3" class="blink"/><circle cx="582" cy="116" r="2.5" class="blink b2"/><circle cx="594" cy="362" r="3" class="blink b3"/><circle cx="176" cy="365" r="2"/></g>
<g font-family="ui-monospace,monospace" fill="#f04444" font-size="10" letter-spacing="2"><text x="26" y="31">OBJECT / 001</text><text x="694" y="31" text-anchor="end">AXIS: X / Y / Z</text><text x="26" y="493">DESIGN IN MOTION</text><text x="694" y="493" text-anchor="end">OBSIDIAN STUDIO</text></g>
<style>.core{transform-origin:360px 230px;animation:levitate 7s ease-in-out infinite}.blink{animation:blink 2.5s ease-in-out infinite alternate}.b2{animation-delay:.8s}.b3{animation-delay:1.6s}@keyframes levitate{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes blink{from{opacity:.25}to{opacity:1}}@media(prefers-reduced-motion:reduce){.core,.blink{animation:none}}</style></svg>