<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t d"><title id="t">Build with intent, explore deeply, refine the details</title><desc id="d">Three custom diagrams for the principles build, explore, and refine on a laser-red and obsidian background.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171416"/><stop offset="1" stop-color="#09090b"/></linearGradient></defs><rect width="1200" height="180" rx="14" fill="url(#bg)"/><g stroke="#f04444" stroke-opacity=".4"><path d="M400 18V162M800 18V162"/></g>
<g font-family="ui-monospace,monospace"><text x="28" y="32" fill="#ff686d" font-size="10" letter-spacing="2">01 / BUILD WITH INTENT</text><g transform="translate(46 76)"><path d="M0 0L25 -14L50 0L25 14Z" fill="#f04444"/><path d="M0 0V29L25 43V14M25 14L50 0V29L25 43" fill="#272024" stroke="#f04444"/><path d="M25 -14V14" stroke="#ffb1b3"/></g><text x="118" y="83" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="23" font-weight="700">Make it real.</text><text x="118" y="108" fill="#a99da0" font-size="11">Turn concepts into working projects.</text>
<text x="428" y="32" fill="#ff686d" font-size="10" letter-spacing="2">02 / EXPLORE DEEPLY</text><g transform="translate(452 91)" fill="none" stroke="#f04444"><circle r="25"/><ellipse rx="11" ry="25" stroke="#ff777b"/><path d="M-24 0H24M-18 -15H18M-18 15H18"/></g><text x="492" y="83" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="23" font-weight="700">Ask better questions.</text><text x="492" y="108" fill="#a99da0" font-size="11">Understand the system underneath.</text>
<text x="828" y="32" fill="#ff686d" font-size="10" letter-spacing="2">03 / REFINE THE DETAILS</text><g transform="translate(850 91)" fill="none" stroke="#f04444" stroke-width="2"><path d="M-25 5H-12L-3 -14L8 20L18 -4H28"/><circle cx="-3" cy="-14" r="3" fill="#ff777b"/><circle cx="8" cy="20" r="3" fill="#ff777b"/></g><text x="895" y="83" fill="#f7f1f1" font-family="Arial,sans-serif" font-size="23" font-weight="700">Polish the experience.</text><text x="895" y="108" fill="#a99da0" font-size="11">Iterate until the details feel right.</text></g><rect x=".5" y=".5" width="1199" height="179" rx="14" fill="none" stroke="#fff" stroke-opacity=".12"/></svg>
